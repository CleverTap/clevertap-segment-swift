name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cancel_previous:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
    - uses: styfle/cancel-workflow-action@0.12.1
      with:
        workflow_id: ${{ github.event.workflow.id }}

  build_package:
    needs: cancel_previous
    # Xcode 27 image. Swap for macos-26 (Xcode 26.x) if the preview label is unavailable.
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.1'
    - uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm
    - name: Build for iOS simulator
      run: |
          xcodebuild -scheme CleverTap-Segment-Swift \
            -destination 'generic/platform=iOS Simulator' \
            build
    - name: Build for tvOS simulator
      run: |
          xcodebuild -scheme CleverTap-Segment-Swift \
            -destination 'generic/platform=tvOS Simulator' \
            build

  build_example:
    needs: cancel_previous
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.1'
    - name: Build ExampleSPM for iOS simulator
      run: |
          cd ExampleSPM/ExampleSPM
          xcodebuild -project "ExampleSPM.xcodeproj" \
            -scheme "ExampleSPM" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
